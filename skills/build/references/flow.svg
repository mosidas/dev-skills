<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 640" width="1300" height="640" role="img" aria-label="build は、ユーザー・分解の AI セッション・loop.py・反復の AI セッションが、進捗ファイルと backlog だけを通して状態を受け渡しながら、番号の順に動く">
  <style>
    :root { --fg: #1f2328; --bg: #ffffff; --accent: #0969da; --muted: #6e7781; --panel: #f6f8fa; --hot-bg: #ddf4ff; --old-bg: #e7ebef; }
    @media (prefers-color-scheme: dark) { :root { --fg: #e6edf3; --bg: #0d1117; --accent: #58a6ff; --muted: #8b949e; --panel: #161b22; --hot-bg: #0f2a4d; --old-bg: #2a2f36; } }
    svg { background: var(--bg); }
    text { font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 13px; fill: var(--fg); }
    .box { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
    .box.hot { fill: var(--hot-bg); stroke: var(--accent); }
    .edge { stroke: var(--fg); stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .label { font-size: 11px; fill: var(--muted); }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>

  <!-- 動作主 -->
  <rect class="box" data-id="User" x="40" y="40" width="340" height="120" rx="6"/><text x="210" y="104" text-anchor="middle">ユーザー</text>
  <rect class="box" data-id="Loop" x="940" y="40" width="260" height="120" rx="6"/><text x="1070" y="94" text-anchor="middle">loop.py</text><text class="label" x="1070" y="114" text-anchor="middle">スクリプト、Claude Code</text>
  <rect class="box" data-id="Decompose" x="40" y="300" width="340" height="80" rx="6"/><text x="210" y="334" text-anchor="middle">AI セッション(分解)</text><text class="label" x="210" y="354" text-anchor="middle">build スキル 3.、1 回だけ</text>
  <rect class="box" data-id="Iterate" x="940" y="300" width="260" height="80" rx="6"/><text x="1070" y="334" text-anchor="middle">AI セッション(反復)</text><text class="label" x="1070" y="354" text-anchor="middle">build スキル 4.、1 タスク 1 プロセス</text>

  <!-- ファイル -->
  <rect class="box hot" data-id="Progress" x="520" y="300" width="240" height="80" rx="6"/><text x="640" y="334" text-anchor="middle">進捗ファイル</text><text class="label" x="640" y="354" text-anchor="middle">停止・要判断・記録・マージ・失敗の上限</text>
  <rect class="box hot" data-id="Backlog" x="520" y="460" width="240" height="80" rx="6"/><text x="640" y="494" text-anchor="middle">backlog</text><text class="label" x="640" y="514" text-anchor="middle">タスクの状態・受け入れ条件・Notes</text>

  <!-- 分解 -->
  <path class="edge" data-edge="User->Decompose" d="M100,160 L100,298"/><text class="label" x="108" y="236">1 PRD を渡す</text>
  <path class="edge" data-edge="Decompose->User" d="M210,300 L210,162"/><text class="label" x="218" y="236">2 タスク案</text>
  <path class="edge" data-edge="User->Decompose" d="M320,160 L320,298"/><text class="label" x="328" y="236">3 承認・マージ許可・上限</text>
  <path class="edge" data-edge="Decompose->Backlog" d="M200,380 L200,500 L518,500"/><text class="label" x="359" y="492" text-anchor="middle">4 タスクを書く</text>
  <path class="edge" data-edge="Decompose->Progress" d="M380,340 L518,340"/><text class="label" x="449" y="332" text-anchor="middle">5 進捗ファイルを作る</text>

  <!-- ループの起動と停止 -->
  <path class="edge" data-edge="User->Loop" d="M380,60 L938,60"/><text class="label" x="659" y="52" text-anchor="middle">6 loop.py を起動</text>
  <path class="edge" data-edge="Loop->User" d="M940,90 L382,90"/><text class="label" x="659" y="82" text-anchor="middle">14 止まる(全 Done・要判断・失敗の上限)</text>
  <path class="edge" data-edge="User->Loop" d="M380,120 L938,120"/><text class="label" x="659" y="112" text-anchor="middle">16 再び起動</text>
  <path class="edge" data-edge="User->Progress" d="M380,150 L600,150 L600,298"/><text class="label" x="490" y="144" text-anchor="middle">15 回答・停止なし</text>
  <path class="edge" data-edge="Progress->Loop" d="M700,300 L700,240 L1000,240 L1000,162"/><text class="label" x="850" y="234" text-anchor="middle">7 停止と失敗回数を読む</text>
  <path class="edge" data-edge="Loop->Iterate" d="M1120,160 L1120,298"/><text class="label" x="1112" y="200" text-anchor="end">8 claude -p で新しいプロセスを起動</text>

  <!-- 反復 -->
  <path class="edge" data-edge="Backlog->Iterate" d="M760,480 L960,480 L960,382"/><text class="label" x="860" y="472" text-anchor="middle">9 タスクを読む</text>
  <path class="edge" data-edge="Progress->Iterate" d="M760,340 L938,340"/><text class="label" x="849" y="332" text-anchor="middle">10 停止と回答を読む</text>
  <path class="edge" data-edge="Iterate->Iterate" d="M1150,380 L1150,410 L1190,410 L1190,382"/><text class="label" x="1170" y="428" text-anchor="middle">11 develop で PR まで</text>
  <path class="edge" data-edge="Iterate->Backlog" d="M1040,380 L1040,520 L762,520"/><text class="label" x="900" y="512" text-anchor="middle">12 Done・Notes</text>
  <path class="edge" data-edge="Iterate->Progress" d="M980,300 L980,280 L740,280 L740,298"/><text class="label" x="860" y="274" text-anchor="middle">13 記録 1 行・停止</text>

  <!-- 凡例 -->
  <rect class="box" x="40" y="593" width="14" height="14" rx="3"/><text class="label" x="62" y="604">動作主</text>
  <rect class="box hot" x="160" y="593" width="14" height="14" rx="3"/><text class="label" x="182" y="604">動作主どうしが状態を受け渡すファイル</text>
</svg>
