<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="560" height="160" role="img" aria-label="クライアントがキャッシュ経由で DB を読む流れ">
  <style>
    :root { --fg: #1f2328; --bg: #ffffff; --accent: #0969da; --muted: #6e7781; --panel: #f6f8fa; --hot-bg: #ddf4ff; --old-bg: #e7ebef; }
    @media (prefers-color-scheme: dark) { :root { --fg: #e6edf3; --bg: #0d1117; --accent: #58a6ff; --muted: #8b949e; --panel: #161b22; --hot-bg: #0f2a4d; --old-bg: #2a2f36; } }
    svg { background: var(--bg); }
    text { font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 13px; fill: var(--fg); }
    .box { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
    .edge { stroke: var(--fg); stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .box.hot { fill: var(--hot-bg); }
    .hot { stroke: var(--accent); }
    .label { font-size: 11px; fill: var(--muted); }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
  <rect class="box" data-id="Client" x="20" y="20" width="120" height="60" rx="6"/><text x="80" y="55" text-anchor="middle">クライアント</text>
  <rect class="box hot" data-id="Cache" x="220" y="20" width="120" height="60" rx="6"/><text x="280" y="55" text-anchor="middle">キャッシュ</text>
  <path class="box" data-id="DB" d="M420,30 v40 a60,10 0 0 0 120,0 v-40 a60,10 0 0 0 -120,0 a60,10 0 0 0 120,0"/><text x="480" y="64" text-anchor="middle">DB</text>
  <path class="edge" data-edge="Client->Cache" d="M140,50 L218,50"/><text class="label" x="180" y="40" text-anchor="middle">読み取り</text>
  <path class="edge" data-edge="Cache->DB" d="M340,50 L418,50"/><text class="label" x="380" y="40" text-anchor="middle">ミス時のみ</text>
  <rect class="box hot" x="20" y="126" width="14" height="14" rx="3"/><text class="label" x="42" y="137">読み取りがここで完結する要素</text>
</svg>
