<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200" role="img" aria-label="クライアントがキャッシュ経由で DB を読む流れ">
  <style>
    :root { --fg: #1f2328; --bg: #ffffff; --accent: #0969da; --muted: #6e7781; }
    @media (prefers-color-scheme: dark) { :root { --fg: #e6edf3; --bg: #0d1117; --accent: #58a6ff; --muted: #8b949e; } }
    svg { background: var(--bg); }
    text { font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 13px; fill: var(--fg); }
    .box { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
    .edge { stroke: var(--fg); stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .hot { stroke: var(--accent); }
    .label { font-size: 11px; fill: var(--muted); }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
  <rect class="box" data-id="Client" x="20" y="60" width="120" height="60" rx="6"/><text x="80" y="95" text-anchor="middle">クライアント</text>
  <rect class="box hot" data-id="Cache" x="220" y="60" width="120" height="60" rx="6"/><text x="280" y="95" text-anchor="middle">キャッシュ</text>
  <rect class="box" data-id="DB" x="420" y="60" width="120" height="60" rx="6"/><text x="480" y="95" text-anchor="middle">DB</text>
  <path class="edge" data-edge="Client->Cache" d="M140,90 L218,90"/><text class="label" x="180" y="80" text-anchor="middle">読み取り</text>
  <path class="edge hot" data-edge="Cache->DB" d="M340,90 L418,90"/><text class="label" x="380" y="80" text-anchor="middle">ミス時のみ</text>
</svg>
